---
name: Deploy HouseDB

on:
  workflow_call:
    inputs:
      version_tag:
        description: 'Tag de imagen a desplegar (opcional, formato vN.YYYYmmDD[-N])'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de imagen a desplegar (opcional, formato vN.YYYYmmDD[-N])'
        required: false
        default: ''
        type: string

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      K3S_NAMESPACE: poc-housedb
      RELEASE_NAME: housedb-backend
      CHART_PATH: ./helm/housedb-backend
      IMAGE_REPOSITORY: ghcr.io/rafex/housedb-backend
      GHCR_PULL_SECRET: ghcr-pull-secret
      GHCR_REGISTRY: ghcr.io
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_EMAIL: actions@github.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Resolve deploy image tag
        id: deploy_tag
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            IMAGE_TAG="${{ inputs.version_tag }}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.version_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="latest"
          fi

          if [ "$IMAGE_TAG" != "latest" ] && ! echo "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]{8}(-[0-9]+)?$'; then
            echo "Invalid deploy tag format: $IMAGE_TAG"
            echo "Expected format: vN.YYYYmmDD[-N] (examples: v1.20260222, v1.20260222-1, v2.20260222)"
            exit 1
          fi

          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Deploy image: ${IMAGE_REPOSITORY}:$IMAGE_TAG"

      - name: Check namespace access
        run: |
          kubectl -n "$K3S_NAMESPACE" auth can-i get deployments >/dev/null

      - name: Ensure GHCR pull secret
        run: |
          test -n "$GHCR_PULL_USERNAME"
          test -n "$GHCR_PULL_TOKEN"
          kubectl -n "$K3S_NAMESPACE" create secret docker-registry "$GHCR_PULL_SECRET" \
            --docker-server="$GHCR_REGISTRY" \
            --docker-username="$GHCR_PULL_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --docker-email="$GHCR_PULL_EMAIL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Lint chart
        run: |
          helm lint "$CHART_PATH"

      - name: Deploy Helm release
        id: helm_deploy
        continue-on-error: true
        run: |
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$K3S_NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="${{ steps.deploy_tag.outputs.value }}" \
            --set imagePullSecrets[0].name="$GHCR_PULL_SECRET" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=housedb-backend \
            --wait --timeout 5m

      - name: Show rollout status
        id: rollout_status
        if: steps.helm_deploy.outcome == 'success'
        continue-on-error: true
        run: |
          kubectl -n "$K3S_NAMESPACE" rollout status deployment/"$RELEASE_NAME" --timeout=180s

      - name: Dump diagnostics on failed deploy
        if: steps.helm_deploy.outcome == 'failure' || steps.rollout_status.outcome == 'failure'
        run: |
          echo "=== Deployments ==="
          kubectl -n "$K3S_NAMESPACE" get deploy
          echo
          echo "=== Pods ==="
          kubectl -n "$K3S_NAMESPACE" get pods -o wide
          echo
          echo "=== ReplicaSets ==="
          kubectl -n "$K3S_NAMESPACE" get rs
          echo
          echo "=== Describe deployment ==="
          kubectl -n "$K3S_NAMESPACE" describe deployment/"$RELEASE_NAME" || true
          echo
          echo "=== Recent events ==="
          kubectl -n "$K3S_NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 50 || true
          echo
          echo "=== Pod details ==="
          kubectl -n "$K3S_NAMESPACE" describe pods \
            -l app.kubernetes.io/name=housedb-backend,app.kubernetes.io/instance="$RELEASE_NAME" || true
          echo
          echo "=== Deployment logs ==="
          kubectl -n "$K3S_NAMESPACE" logs deployment/"$RELEASE_NAME" --all-containers --tail=200 || true

      - name: Fail if Helm deploy did not succeed
        if: steps.helm_deploy.outcome == 'failure' || steps.rollout_status.outcome == 'failure'
        run: |
          echo "Helm deploy no alcanzo estado Ready dentro del timeout" >&2
          exit 1

      - name: Print deployed image reference
        if: steps.helm_deploy.outcome == 'success' && steps.rollout_status.outcome == 'success'
        run: |
          IMAGE_URL="${IMAGE_REPOSITORY}:${{ steps.deploy_tag.outputs.value }}"
          echo "Deployed image URL: $IMAGE_URL"

  deploy-frontend:
